services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: resume_intelligence_api
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ENVIRONMENT=production
      - DEBUG=false
      - DATABASE_URL=postgresql+asyncpg://postgres:postgres@db:5432/resume_intelligence
      - HOST=0.0.0.0
      - PORT=8000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - app_data:/app/data/resumes/uploads

  db:
    image: postgres:16-alpine
    container_name: resume_intelligence_db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=resume_intelligence
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d resume_intelligence"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  app_data:
